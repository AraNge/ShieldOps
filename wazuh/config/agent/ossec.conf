<ossec_config>

  <!-- CLIENT CONFIGURATION -->
  <client>
    <server>
      <address>wazuh.manager</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>linux,docker</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
  </client>

  <!-- NATIVE DOCKER LISTENER -->
  <wodle name="docker-listener">
    <disabled>no</disabled>
    <run_on_start>yes</run_on_start>
    <interval>30s</interval>
    <attempts>5</attempts>
  </wodle>

  <!-- DOCKER EVENTS (Fallback / More Reliable Method) -->
  <wodle name="command">
    <disabled>no</disabled>
    <tag>docker-events</tag>
    <command>/usr/bin/docker events --format '{{json .}}' --since 30s</command>
    <interval>30s</interval>
    <run_on_start>yes</run_on_start>
    <timeout>25</timeout>
  </wodle>

  <!-- DOCKER CONTAINER INVENTORY -->
  <wodle name="command">
    <disabled>no</disabled>
    <tag>docker-ps</tag>
    <command>/usr/bin/docker ps -a --format "table {{.ID}}\t{{.Names}}\t{{.Image}}\t{{.Status}}\t{{.RunningFor}}\t{{.Ports}}"</command>
    <interval>5m</interval>
    <timeout>30</timeout>
    <run_on_start>yes</run_on_start>
  </wodle>

  <!-- DOCKER RESOURCE STATISTICS -->
  <wodle name="command">
    <disabled>no</disabled>
    <tag>docker-stats</tag>
    <command>/usr/bin/docker stats --no-stream --format "{{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}\t{{.NetIO}}\t{{.BlockIO}}"</command>
    <interval>5m</interval>
    <timeout>30</timeout>
    <run_on_start>yes</run_on_start>
  </wodle>

  <!-- FILE INTEGRITY MONITORING (FIM) -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>

    <!-- Critical Docker paths -->
    <directories check_all="yes" report_changes="yes" realtime="yes">/var/run/docker.sock</directories>
    <directories check_all="yes" report_changes="yes">/etc/docker</directories>
    <directories check_all="yes" report_changes="yes">/var/lib/docker/containers</directories>
    <directories check_all="yes" report_changes="yes">/var/lib/docker/overlay2</directories>
  </syscheck>

  <!-- ROOTCHECK -->
  <rootcheck>
    <disabled>no</disabled>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>
    <frequency>43200</frequency>
  </rootcheck>

  <!-- SECURITY CONFIGURATION ASSESSMENT -->
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>no</scan_on_start>
    <interval>1d</interval>
    <skip_nfs>yes</skip_nfs>
  </sca>

  <!-- LOCAL LOG MONITORING -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/docker/*.log</location>
  </localfile>

</ossec_config>